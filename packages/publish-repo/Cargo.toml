[package]
name = "labyrinth-publish-repo"
version = "1.0.0"
edition = "2021"
description = "Labyrinth OS's daily package publish: fresh copies of the sources from GitHub, the changed packages built, signed with Labyrinth's key and put in the release \"packages\" (was scripts/publish-repo.py)"
license = "MPL-2.0"
publish = false

[lib]
name = "labyrinth_publish_repo"
path = "src/lib.rs"

[[bin]]
name = "labyrinth-publish-repo"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
