# Labyrinth: a snapshot chosen in the boot menu starts with a writable layer in memory (grub-btrfs' overlay hook), so the
# desktop, the network and Claude work there as usual. System changes made in that session are lost at the next restart;
# /home is the real one. On a normal boot the hook does nothing (it only acts on a read-only btrfs snapshot).
if [[ -e /usr/lib/initcpio/install/grub-btrfs-overlayfs && " ${HOOKS[*]} " != *" grub-btrfs-overlayfs "* ]]; then
  HOOKS+=(grub-btrfs-overlayfs)
fi
