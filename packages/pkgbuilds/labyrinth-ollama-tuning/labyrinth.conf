# Labyrinth's settings for Ollama (the labyrinth-ollama-tuning package; Ollama's own unit is untouched and updates as usual).
[Service]
# Sarina needs at least 8k tokens of context (16k recommended); Ollama's default is 4k.
Environment=OLLAMA_CONTEXT_LENGTH=16384
# Less graphics-card memory for the same speed: flash attention plus an 8-bit key/value cache halves the memory a conversation takes
# (about 2.2 GB at 16k context becomes about 1.1 GB); the answers are not noticeably different.
Environment=OLLAMA_FLASH_ATTENTION=1
Environment=OLLAMA_KV_CACHE_TYPE=q8_0
