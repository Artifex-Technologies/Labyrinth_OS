[package]
name = "labyrinth-distress"
version = "0.1.0"
edition = "2021"
description = "Labyrinth's distress password: a second password that quietly does something else when it is typed"
license = "MIT"

[[bin]]
name = "labyrinth-distress"
path = "src/main.rs"

[features]
# Lets tests point the helper at other folders and switch on a dry run through the environment. NEVER in a release build.
test-paths = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
