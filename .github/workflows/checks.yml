# Runs the checks that need no root and no hardware, on every push and pull request.
# Not yet run on GitHub (written 2026-10-16): if the first run fails on a missing tool, add it to the pacman line below.
name: checks
on:
  push:
  pull_request:
  schedule:
    - cron: "53 5 * * 1" # the audit weekly, for advisories published after the last change
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git python base-devel systemd shellcheck nftables libnotify
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: Let git trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: "Release checks (quick, no Rust tests or audit)"
        run: |
          useradd -m ci
          chown -R ci "$GITHUB_WORKSPACE"
          # the installer tests run Yggdrasil's install program with Labyrinth's settings (tests/test_install_system.py): its Python
          # script, taken from the commit that last had it (removed 2026-11-15)
          su ci -c "git clone --quiet --depth 1 https://github.com/Artifex-Technologies/Yggdrasil.git /home/ci/Yggdrasil"
          su ci -c "git -C /home/ci/Yggdrasil fetch --quiet --depth 1 origin f9c76a5b6af82198f91b242a4460628d41770599"
          su ci -c "cd '$GITHUB_WORKSPACE' && YGGDRASIL_DIR=/home/ci/Yggdrasil scripts/release-check.sh quick"
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git rust base-devel pkgconf wayland libxkbcommon fontconfig pam dbus python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: Format, lint, test and audit every crate
        run: |
          # RUSTSEC-2026-0370/0371/0372: zvariant, zbus_names and zvariant_derive are marked unmaintained (no vulnerability); zbus uses them
          # and every D-Bus program here depends on zbus. Revisit when zbus moves on.
          cargo install cargo-audit --locked
          for d in packages/*/; do
            [ -f "$d/Cargo.toml" ] || continue
            # formatting (each crate's rustfmt.toml) and lints first: the debt cleared on 2026-11-11 must not come back
            (cd "$d" && cargo fmt --check) || exit 1
            (cd "$d" && cargo clippy --quiet --all-targets -- -D warnings) || exit 1
            (cd "$d" && cargo test --quiet) || exit 1
            (cd "$d" && ~/.cargo/bin/cargo-audit audit -D warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0192 --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0372) || exit 1
          done
      - name: The Python and shell tests of labyrinth-tools' programs, on the debug build the tests above made
        run: |
          d=packages/tools/target/debug
          LABYRINTH_CLEANUP=$d/labyrinth-install-cleanup bash tests/test_install_cleanup.sh
          LABYRINTH_SARINA_ASK=$d/labyrinth-sarina-ask python3 tests/test_labyrinth_sarina_ask.py
          LABYRINTH_SARINA_SPEAK=$d/labyrinth-sarina-speak python3 tests/test_sarina_speak.py
