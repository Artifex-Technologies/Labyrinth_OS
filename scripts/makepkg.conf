#!/hint/bash
# makepkg settings for packages other people install: the ISO's packages and the published repository (Labyrinth's and
# LykanOS's). scripts/build-local-packages.sh and labyrinth-publish-repo (packages/publish-repo) pass this file to makepkg
# with --config.
#
# The build machine's own /etc/makepkg.conf may tune for its CPU (CachyOS's says -march=native and target-cpu=native). A
# program built that way uses instructions only that CPU family has and stops with "illegal instruction" on others
# (2026-11-07: every Rust program here had been built for an i9-9900K). Everything else comes from the machine's settings.

source /etc/makepkg.conf
for _conf in /etc/makepkg.conf.d/*.conf; do
  [[ -r $_conf ]] && source "$_conf"
done
unset _conf

# Source paths compiled into programs (panic messages, assertions) name the folders they were built in, and those are under
# the builder's home: the account name would be in every package. The home folder is written /build instead.
# (labyrinth-publish-repo also builds outside the home folder, for the paths in each package's .BUILDINFO.)
_home_map="${HOME:?}=/build"

# Any 64-bit PC, as Arch builds its own packages (Labyrinth itself needs x86-64-v3, LykanOS does not)
CFLAGS="-march=x86-64 -mtune=generic -O2 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection -ffile-prefix-map=$_home_map"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
# Rust's own default CPU for each target (x86-64; pentium4 for the 32-bit Vulkan layer): no target-cpu here
RUSTFLAGS="--remap-path-prefix=$_home_map"
unset _home_map
