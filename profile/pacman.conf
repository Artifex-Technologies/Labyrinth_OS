# CachyOS x86-64-v3 repos (i9-9900K: AVX2 yes, AVX-512 no). v3 sections go first.
# The CachyOS keyring (signing key F3B607488DB35A47) and mirrorlists must be
# provisioned by the build script before mkarchiso runs. UNVERIFIED: see docs/STATUS.md.
[options]
HoldPkg           = pacman glibc
Architecture      = x86_64 x86_64_v3
CheckSpace
ParallelDownloads = 8
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Packages we build ourselves (calamares, labyrinth-minos, labyrinth-weather, proton-pass,
# visual-studio-code-bin). scripts/build.sh replaces the placeholder with the absolute path of
# repo/x86_64 in a work copy; the checked-in file stays portable. Build host only: the
# installed system's /etc/pacman.conf is profile/airootfs/etc/pacman.conf, which has no
# local repo.
[labyrinth]
SigLevel = Optional TrustAll
Server = file://@@LABYRINTH_REPO_DIR@@
