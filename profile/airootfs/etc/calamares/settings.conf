# Calamares job sequence for Labyrinth OS.
#
# Derived from the settings.conf in the Calamares 3.4.2 source tarball, via
# Chymaera_OS. Differences from upstream, all load-bearing:
#
#   * `initramfs` is not in the sequence. packages/pkgbuilds/calamares/PKGBUILD
#     builds with -DSKIP_MODULES=initramfs, so listing it makes Calamares fail at
#     startup. `initcpio` and `initcpiocfg` are the Arch ones and stay.
#   * `shellprocess@cleanup` runs straight after `unpackfs`: the live image is not
#     an installable root (see labyrinth-install-cleanup).
#   * `grubcfg` runs before `bootloader` (it writes /etc/default/grub, which
#     `bootloader` then turns into grub.cfg), and `shellprocess@bootfinish` runs
#     after it (snapshots, services; see labyrinth-install-bootfinish).
#
# The install is a copy of the live squashfs (`unpackfs`), not a pacstrap: no
# package resolution, no download, works offline. See docs/INSTALLER.md.
---
modules-search: [ local ]

instances:
- id: cleanup
  module: shellprocess
  config: shellprocess_cleanup.conf
- id: bootfinish
  module: shellprocess
  config: shellprocess_bootfinish.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@cleanup
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - shellprocess@bootfinish
  - umount
- show:
  - finished

branding: labyrinth

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
