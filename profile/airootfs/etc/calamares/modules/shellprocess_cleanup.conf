# Turn the freshly unpacked live image into an installable system.
#
# Runs inside the target (dontChroot: false); the script is already there because
# it ships in the squashfs. Must come right after unpackfs and before
# initcpiocfg/initcpio/users/displaymanager, which read what it removes/restores.
---
dontChroot: false
timeout: 300
verbose: true
script:
    - "/usr/local/bin/labyrinth-install-cleanup"
