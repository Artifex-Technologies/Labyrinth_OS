# After the bootloader is installed: verify it, set up snapshots, enable services.
# Runs inside the target. Failures in the snapshot/service steps are warnings; a
# missing or empty grub.cfg is fatal (the machine would not boot).
---
dontChroot: false
timeout: 300
verbose: true
script:
    - "/usr/local/bin/labyrinth-install-bootfinish"
