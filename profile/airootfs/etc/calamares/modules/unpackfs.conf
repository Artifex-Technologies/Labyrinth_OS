# Unpack the live medium's root filesystem onto the target.
#
# archiso mounts the ISO at /run/archiso/bootmnt, and mkarchiso puts the image at
# <install_dir>/<arch>/airootfs.sfs. Our install_dir is "labyrinth"
# (profile/profiledef.sh), NOT archiso's default "arch". Keep the two in step.
#
# The squashfs is mounted and rsynced, so install time is bounded by
# decompression and disk writes (profiledef.sh uses zstd for that reason).
---
unpack:
    -   source: "/run/archiso/bootmnt/labyrinth/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
