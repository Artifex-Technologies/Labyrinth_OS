# clamd's settings on Labyrinth OS (`man clamd.conf`, ClamAV 1.5). Only clamd and clamdscan read this file; clamscan does not
# (Heimdall's `heimdall-fileguard scan` gives clamscan the same limits on its command line).
#
# The first block is Arch's own clamav package, unchanged. The second sets ClamAV's limits explicitly and makes it SAY when it
# stops at one ("Heuristics.Limits.Exceeded.*"): a decompression bomb ("ZIP bomb") is then reported instead of silently
# half-scanned. That name is never malware here: `heimdall-fileguard scan` calls it "not-fully-scanned" (a warning) and
# labyrinth-scan-downloads writes it to its log as NOT FULLY SCANNED, so a big legitimate archive is never quarantined for its
# size. Heimdall docs/PRIVACY_PACK.md, "Safe file intake".

LogFile /var/log/clamav/clamd.log
LogTime yes
PidFile /run/clamav/clamd.pid
TemporaryDirectory /tmp
LocalSocket /run/clamav/clamd.ctl
User clamav

# A file bigger than this is not scanned (ClamAV cannot scan files over 2 GB at all).
MaxFileSize 256M
# Most data scanned per file: an archive and everything unpacked from it count together.
MaxScanSize 512M
# Archives inside archives, this deep.
MaxRecursion 12
# Files inside one archive or document.
MaxFiles 10000
# Two minutes per file at most (in milliseconds).
MaxScanTime 120000
# Say "Heuristics.Limits.Exceeded.<limit>" when a limit above is reached, instead of answering "OK".
AlertExceedsMax yes
# Heuristic alerts (broken or overlapping ZIP entries among them) stay on, as ClamAV's default.
HeuristicAlerts yes
