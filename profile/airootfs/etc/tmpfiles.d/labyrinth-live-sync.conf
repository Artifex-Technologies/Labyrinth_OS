# The live medium's pacman gets the package lists its image was built from (scripts/build.sh saves them; mkarchiso removes
# its own), so the installer can install a chosen browser from them. Copied only while /var/lib/pacman/sync is missing or
# empty; labyrinth-install-cleanup removes this file and the lists from an installed system.
C /var/lib/pacman/sync - - - - /usr/share/labyrinth/sync
