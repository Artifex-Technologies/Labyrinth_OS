# Labyrinth's kernel settings that close known kinds of holes at no cost anyone would notice (Heimdall's hardening check, docs/AUDITS.md).
# Left alone on purpose: unprivileged user namespaces (Steam, Flatpak and browsers need them) and nested virtualisation.

# old serial-line modules are not loaded on any user's request (a recurring source of root exploits)
dev.tty.ldisc_autoload = 0
# kernel addresses hidden from programs without the syslog right (root still sees them)
kernel.kptr_restrict = 1
# programs cannot be tricked into writing to a planted pipe or file in shared folders such as /tmp
fs.protected_fifos = 2
fs.protected_regular = 2
# the BPF compiler's output is hardened against smuggled code (only when the kernel has the setting)
-net.core.bpf_jit_harden = 2
