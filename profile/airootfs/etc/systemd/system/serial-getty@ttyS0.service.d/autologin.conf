# Live medium only: a root shell on the first serial port (QEMU -serial, a real serial header).
# Used by scripts/vm/serial.py to test the live session and the installer unattended.
# labyrinth-install-cleanup removes it from the installed system.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud 115200,57600,38400,9600 %I $TERM
