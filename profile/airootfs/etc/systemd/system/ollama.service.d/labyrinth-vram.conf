# Labyrinth: less graphics-card memory for the same speed. Flash attention plus an 8-bit key/value cache halves the memory the
# conversation takes (about 2.2 GB at 16k context becomes about 1.1 GB); the answers are not noticeably different.
[Service]
Environment=OLLAMA_FLASH_ATTENTION=1
Environment=OLLAMA_KV_CACHE_TYPE=q8_0
