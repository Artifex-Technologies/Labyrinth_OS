# Ghostty's unit is Type=notify-reload. systemd 262 refuses such a service when its main process has
# no handler for the reload signal at the moment it reports ready, and Ghostty installs its SIGUSR2
# handler slightly later: the service failed with "lacks handler for reload signal USR2, refusing
# service startup", and Win+Return opened nothing (seen in the VM, 2026-10-11). Start it as a plain
# D-Bus service instead; reloading still sends SIGUSR2, which Ghostty handles once it is up.
[Service]
Type=dbus
ReloadSignal=
ExecReload=/bin/kill -USR2 $MAINPID
