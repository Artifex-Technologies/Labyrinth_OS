# Labyrinth: known malware, phishing, scam and botnet domains (and every name under them) do not resolve.
# Written daily by labyrinth-dns-blocklist; to allow a domain: sudo labyrinth-dns-blocklist allow DOMAIN
conf-file=/var/lib/labyrinth/dns-block/blocklist.conf
# a slightly larger cache than NetworkManager's default
cache-size=2000
