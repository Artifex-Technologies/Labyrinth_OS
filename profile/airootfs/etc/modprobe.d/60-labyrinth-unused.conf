# Kernel parts this computer never uses, switched off so nothing can load them on demand (2026-10-27 security audit).
# "Black October" 2026 leaked unpatched holes in the kernel's SMB server (ksmbd: remote code execution without a login) and in
# SMB Direct (SMB over RDMA); rarely used network protocols and the VMware-only graphics driver are frequent routes to root.
# The normal SMB client (cifs, for network shares in Minos) stays available; without RDMA it cannot use SMB Direct.
install ksmbd /bin/false
install ib_core /bin/false
install rdma_cm /bin/false
install rdma_rxe /bin/false
install siw /bin/false
install nvme_rdma /bin/false
install nvmet /bin/false
install nvmet_tcp /bin/false
install nvmet_rdma /bin/false
install vmwgfx /bin/false
install dccp /bin/false
install sctp /bin/false
install tipc /bin/false
install rds /bin/false
install n_hdlc /bin/false
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
