# The start-up image without the graphics drivers blacklisted here: nouveau, wherever NVIDIA's own driver is installed (about
# 75 MB less for GRUB to read at every start). labyrinth-kms takes kms's place; Intel and AMD chips keep their early start.
# Read after the drop-ins that place a hook next to kms (the boot screen's), before zz-turing-unlock.conf. Never on the live
# medium, whose image must start on every card. To have kms again: comment the line out and run `sudo mkinitcpio -P`.
[[ " ${HOOKS[*]} " == *" archiso "* ]] || for _h in "${!HOOKS[@]}"; do [[ ${HOOKS[_h]} == kms ]] && HOOKS[_h]=labyrinth-kms; done; unset _h
