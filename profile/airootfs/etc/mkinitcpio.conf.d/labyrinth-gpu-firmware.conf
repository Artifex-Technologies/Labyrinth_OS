# Only the NVIDIA open driver's firmware for this computer's card generation in the start-up image (Turing's, or Ampere's and
# later ones'): about 53 MB less for GRUB to read at every start with a Turing card. Never on the live medium, whose image
# must start on every card. To have every generation's firmware again: comment the line out and run `sudo mkinitcpio -P`.
[[ " ${HOOKS[*]} " == *" archiso "* || " ${HOOKS[*]} " == *" labyrinth-gpu-firmware "* ]] || HOOKS+=(labyrinth-gpu-firmware)
