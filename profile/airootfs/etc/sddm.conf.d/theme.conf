# Login screen theme: Breeze (Plasma's own, always matches the installed Plasma).
# WhiteSur's SDDM theme (whitesur-kde-theme) was used until 2026-10-16: it imports a Breeze component, VirtualKeyboardLoader,
# that Plasma 6.8 removed, so after the upgrade the login screen showed "The current theme cannot be loaded". Go back to WhiteSur
# only when the package is updated for Plasma 6.8 (test it in a VM first: a broken login theme blocks every login).
[Theme]
Current=breeze
CursorTheme=WhiteSur-cursors
