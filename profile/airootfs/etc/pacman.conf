# CachyOS x86-64-v3 repos (i9-9900K: AVX2 yes, AVX-512 no). v3 sections go first.
# The CachyOS keyring (signing key F3B607488DB35A47) and mirrorlists must be
# provisioned by the build script before mkarchiso runs. UNVERIFIED: see docs/STATUS.md.
[options]
HoldPkg           = pacman glibc
Architecture      = x86_64 x86_64_v3
CheckSpace
ParallelDownloads = 8
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Labyrinth's own software: the desktop (Yggdrasil), Sarina, Heimdall, Limbo and the store's apps, built from
# their GitHub repositories and signed with Labyrinth's key (the labyrinth-keyring package). Last on purpose: a
# package of the same name in Arch's or CachyOS's repositories always wins, so this repository can add and
# update Labyrinth's software but never replace the base system. See docs/PACKAGE_REPO.md.
[labyrinth]
SigLevel = Required
Server = https://github.com/Artifex-Technologies/Labyrinth_OS/releases/download/packages
