# Sarina in Yggdrasil (see Yggdrasil's docs/INTEGRATIONS.md). Installed with Sarina: without her, the desktop has no assistant.
kind = assistant
name = Sarina
ask = /usr/local/bin/labyrinth-sarina-ask
speak = /usr/local/bin/labyrinth-sarina-speak
warm = /usr/local/bin/labyrinth-sarina-warm
runtime = labyrinth-sarina
shortcut = Super+S
choice.a_voice = Voice | The voice she answers with (a short sentence plays when you pick one) | /usr/local/bin/labyrinth-sarina-setting voice
action.b_hear = Hear her voice | Plays a short sentence | /usr/local/bin/labyrinth-sarina-setting hear
switch.c_tone = Notice how I sound | She notices your pace, loudness, pitch and pauses compared with how you usually sound, and adjusts quietly (briefer when you sound rushed, gentler when tired). Only a few averages are kept, on this computer, never recordings or words | /usr/local/bin/labyrinth-sarina-setting tone
action.d_forget = Forget how I sound | Deletes those averages; she starts learning again from the next question | /usr/bin/sarina-tone --forget
switch.e_forge = Agent Forge | She may write small programs and run them, only inside Limbo's disposable guests (no network, nothing on this computer) | /usr/local/bin/labyrinth-sarina-setting forge
switch.f_checkup = Daily check-up | Once a day she looks at crashes, failed services, full disks and kernel errors (read-only), and tells you only when something is wrong; skipped while a game uses the graphics card | /usr/local/bin/labyrinth-sarina-setting checkup
switch.g_learn = Learn from our talks | Once a day she keeps what your talks show about you in her vault (Entities/About Zlothra), each with your own words as evidence; and turns Inbox files into notes. You can edit or forget anything there | /usr/local/bin/labyrinth-sarina-setting learn
action.h_agents = Agents she wrote | Opens a terminal with her agents, to approve or remove them (approving shows every file first) | /usr/local/bin/labyrinth-sarina-setting agents
