# Labyrinth's software in Agora, the desktop's app store (Yggdrasil's docs/INTEGRATIONS.md, kind "packages").
kind = packages
name = Labyrinth
catalog = /usr/share/labyrinth/agora/catalog.json
components = /usr/share/labyrinth/components.json
component = /usr/bin/labyrinth-apps
own_builds = /usr/share/labyrinth/pkgbuilds
# device software offered by the installed system itself (Yggdrasil's packages/device-offers): once online, when a USB device is
# plugged in and at sign-in, what the installer's own list has for this computer's devices and is not installed yet. One list,
# the installer's; what the installer queued for the first login is left to labyrinth-first-components.
devices = /usr/share/labyrinth/installer-extras.json
first_login = /var/lib/labyrinth/first-login-components.json
