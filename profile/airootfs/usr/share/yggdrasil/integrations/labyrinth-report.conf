# Report a problem (Settings > About; Yggdrasil's docs/INTEGRATIONS.md): where Labyrinth's reports go, and Labyrinth's own
# checks in them. Every text in a report is scrubbed of names, addresses, Wi-Fi names and serial numbers first.
kind = report
name = Labyrinth OS
email = support@artifextech.sh
# for someone with a GitHub account: Open a GitHub issue (public, under their account)
github = https://github.com/Artifex-Technologies/Labyrinth_OS
include.a_selfcheck = Self-check | /usr/bin/labyrinth-selfcheck
include.b_packages = Packages | /usr/bin/pacman -Q
