# Labyrinth's look inside Yggdrasil (see Yggdrasil's docs/INTEGRATIONS.md). The OS name and logo come from /etc/os-release.
kind = branding
accent = #7c54d6
wallpaper = /usr/share/wallpapers/labyrinth/labyrinth-purple.png
# the boot screen's animation (a Plymouth theme; Settings > Appearance > Boot screen)
boot_theme = labyrinth-rain
# the logo on the screen after signing in (Yggdrasil's yggdrasil-splash)
splash_logo = /usr/share/labyrinth/logo/labyrinth-splash.png
