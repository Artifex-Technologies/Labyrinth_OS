# Labyrinth installs through Yggdrasil's installer window and its install program (yggdrasil-install-system, in the
# yggdrasil-installer package; Yggdrasil's docs/INSTALLER.md): the window asks, the program does the work as root (pkexec; the
# choices come as JSON on standard input). Until 2026-11-07 it was Labyrinth's own labyrinth-install-system; it moved to Yggdrasil
# so LykanOS installs the same way. What is Labyrinth's comes from here:
kind = installer
command = /usr/bin/yggdrasil-install-system
name = Labyrinth
# run inside the new system: first the clean-up of the live medium (live account, its sign-in and no-password rules; kernels
# and start-up presets put back), then the last checks; the boot menu's look after the plain menu is written
cleanup = /usr/local/bin/labyrinth-install-cleanup
finish = /usr/local/bin/labyrinth-install-bootfinish
boot_menu_theme = /usr/local/bin/labyrinth-grub-theme
# the boot screen, and what NVIDIA's Wayland support needs
kernel_options = quiet splash nvidia_drm.modeset=1 nvidia_drm.fbdev=1
groups = users lp video network storage wheel audio openrazer kvm
reserved_logins = heimdall sarina
# the browsers offered on the installer's Browsers page (the first chosen, or the one picked, becomes the default)
browsers = /usr/share/labyrinth/installer-browsers.json
# optional parts offered on one page ("AI and security": Sarina, Heimdall; device software), what each installs, and the list
# labyrinth-first-components installs at the new user's first login (those the medium does not carry)
extras = /usr/share/labyrinth/installer-extras.json
components = /usr/share/labyrinth/components.json
first_login = /var/lib/labyrinth/first-login-components.json
