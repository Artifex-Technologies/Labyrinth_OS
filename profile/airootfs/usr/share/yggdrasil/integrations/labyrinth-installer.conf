# Labyrinth installs through Yggdrasil's installer window (yggdrasil-installer): the window asks, this program does the work
# (as root, through pkexec; the choices come as JSON on standard input). See /usr/local/bin/labyrinth-install-system.
kind = installer
command = /usr/local/bin/labyrinth-install-system
# the browsers offered on the installer's Browsers page (the first chosen, or the one picked, becomes the default)
browsers = /usr/share/labyrinth/installer-browsers.json
