# Labyrinth's app launcher and per-app rules in the desktop (Yggdrasil's docs/INTEGRATIONS.md, kind "apps"): apps opened from the
# dock, start menu or Settings start through labyrinth-launch, and Settings > Apps shows each app's network rule, the places it was
# allowed or denied, its sandbox and its usage.
kind = apps
launch = /usr/local/bin/labyrinth-launch
unit_prefix = lapp_
settings = %h/.config/labyrinth/apps
usage = %h/.local/share/labyrinth/app-usage.json
network = /usr/local/bin/labyrinth-appnet
network_rules = /etc/labyrinth/app-network.json
network_ask = /run/labyrinth/appnet-ask.sock
