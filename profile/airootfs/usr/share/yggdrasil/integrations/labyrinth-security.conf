# Heimdall, Labyrinth's security monitor, in the desktop (Yggdrasil's docs/INTEGRATIONS.md, kind "security"): its alerts in the
# panel and Settings, the quarantine, the malware scan, and the distress password.
kind = security
name = Heimdall
api = http://127.0.0.1:8930
scan = /usr/local/bin/labyrinth-security-setting scan
quarantine = /usr/local/bin/labyrinth-quarantine
distress = /usr/bin/labyrinth-distress
distress_set = /etc/labyrinth/distress.json
contained = /etc/heimdall/contained
release = /usr/bin/heimdalld contain release
switch.a_auto_quarantine = Move certain malware to quarantine automatically | New files in Downloads, Desktop, drives and mail attachment folders are checked as they arrive. Only definite finds in your own files are moved; guesses and anything else just warn. Nothing is ever deleted without you | /usr/local/bin/labyrinth-security-setting auto-quarantine
