# Heimdall, Labyrinth's security monitor, in the desktop (Yggdrasil's docs/INTEGRATIONS.md, kind "security"): its alerts in the
# panel and Settings, the quarantine, the malware scan, and the distress password.
kind = security
name = Heimdall
api = http://127.0.0.1:8930
scan = /usr/bin/labyrinth-security-setting scan
quarantine = /usr/bin/labyrinth-quarantine
distress = /usr/bin/labyrinth-distress
distress_set = /etc/labyrinth/distress.json
contained = /etc/heimdall/contained
release = /usr/bin/heimdalld contain release
held_release = /usr/bin/heimdalld immunity release
held_confirm = /usr/bin/heimdalld immunity confirm
switch.a_auto_quarantine = Move certain malware to quarantine automatically | New files in Downloads, Desktop, drives and mail attachment folders are checked as they arrive. Only definite finds in your own files are moved; guesses and anything else just warn. Nothing is ever deleted without you | /usr/bin/labyrinth-security-setting auto-quarantine
# Wi-Fi & Network > Devices (who is on a trusted home network) and Wi-Fi checks (why the Wi-Fi is slow); Heimdall's
# docs/DEVICES.md and docs/WIFI_HEALTH.md. Starting the scan needs no password (polkit rule 50-heimdall-lan-scan.rules).
devices_scan = /usr/bin/systemctl start heimdall-lan-scan.service
# what a device is, when the list's guess is wrong (run through pkexec + MAC KIND: the administrator's password)
devices_kind = /usr/bin/heimdalld lan kind
# a network that is not home, when its page opens: listens for 8 seconds as you (no password), sends and keeps nothing
devices_look = /usr/bin/heimdalld lan look
wifi_check = /usr/bin/heimdalld wifi-health --json
# what the automatic scans skip (labyrinth-scan-downloads reads it): Settings > Security lists it with Add and Remove
scan_exclude = %h/.config/labyrinth/scan-exclude
