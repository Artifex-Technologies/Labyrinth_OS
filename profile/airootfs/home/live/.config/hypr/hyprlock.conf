# Labyrinth lock screen: the "Split" design from SirJul1337/omarchy-lock-explorer (MIT),
# redrawn with hyprlock. Wallpaper on the left with the clock bottom-left; a dark panel on the
# right with the avatar, greeting, name and password field. The original is QML for Omarchy's
# shell, which Labyrinth does not have, so this is a re-creation of its layout, not its code.
# Panel width is 34% of the screen (the original clamps it to 420-560 px).

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /usr/share/wallpapers/labyrinth/labyrinth-purple.png
    blur_passes = 0
    brightness = 0.85
    vignette_strength = 0.4
}

# Right-hand panel.
shape {
    monitor =
    size = 34%, 100%
    color = rgba(23, 13, 38, 0.78)
    rounding = 0
    border_size = 0
    halign = right
    valign = center
    position = 0, 0
}
# Hairline on the panel's left edge.
shape {
    monitor =
    size = 1, 100%
    color = rgba(255, 255, 255, 0.14)
    rounding = 0
    border_size = 0
    halign = right
    valign = center
    position = 34%, 0
}

# Avatar: a ring with the user's initial.
shape {
    monitor =
    size = 84, 84
    color = rgba(255, 255, 255, 0.10)
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.35)
    halign = right
    valign = center
    position = -15%, 160
}
label {
    monitor =
    text = cmd[update:0] printf '%s' "$USER" | cut -c1 | tr '[:lower:]' '[:upper:]'
    color = rgba(232, 224, 245, 1.0)
    font_size = 34
    font_family = JetBrainsMono Nerd Font
    halign = right
    valign = center
    position = -15%, 160
}
label {
    monitor =
    text = WELCOME BACK
    color = rgba(232, 224, 245, 0.55)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    halign = right
    valign = center
    position = -15%, 85
}
label {
    monitor =
    text = $DESC
    color = rgba(232, 224, 245, 1.0)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    halign = right
    valign = center
    position = -15%, 50
}
input-field {
    monitor =
    size = 22%, 58
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = false
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = rgb(232, 224, 245)
    fade_on_empty = false
    rounding = 14
    placeholder_text = <span foreground="##b3a6c9">Password</span>
    fail_text = <span foreground="##ff8a8a">Wrong password ($ATTEMPTS)</span>
    check_color = rgba(124, 84, 214, 0.5)
    fail_color = rgba(255, 138, 138, 0.5)
    halign = right
    valign = center
    position = -15%, -30
}
label {
    monitor =
    text = Press Enter to unlock
    color = rgba(232, 224, 245, 0.55)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    halign = right
    valign = center
    position = -15%, -85
}
# Host name, bottom of the panel.
label {
    monitor =
    text = cmd[update:0] printf '  %s' "$(cat /etc/hostname 2>/dev/null)"
    color = rgba(232, 224, 245, 0.35)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    halign = right
    valign = bottom
    position = -15%, 30
}

# Clock and date, bottom-left, over the wallpaper.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 4
    halign = left
    valign = bottom
    position = 56, 90
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(255, 255, 255, 0.8)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 3
    halign = left
    valign = bottom
    position = 60, 56
}
