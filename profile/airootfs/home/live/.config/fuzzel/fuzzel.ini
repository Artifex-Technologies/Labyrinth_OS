# Launcher and menus (also used by the power / quick-settings menu): dark green, rounded,
# to match the bar. fuzzel's default is a bright cream theme, which clashed with everything.
[main]
font=JetBrainsMono Nerd Font:size=13
prompt=">  "
width=42
lines=9
horizontal-pad=24
vertical-pad=18
inner-pad=10
icon-theme=Adwaita

[colors]
background=0e1e16f2
text=d9f2e1ff
prompt=8fd9a8ff
input=d9f2e1ff
match=8fd9a8ff
selection=1f4a37ff
selection-text=ffffffff
selection-match=b6f0c9ff
border=8fd9a855

[border]
width=1
radius=20
