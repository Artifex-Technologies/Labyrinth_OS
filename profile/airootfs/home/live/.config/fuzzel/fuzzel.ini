# Launcher and menus (also used by the power / quick-settings menu): dark green, rounded,
# to match the bar. fuzzel's default is a bright cream theme, which clashed with everything.
[main]
font=JetBrainsMono Nerd Font:size=13
prompt=">  "
width=42
lines=9
horizontal-pad=24
vertical-pad=18
inner-pad=10
icon-theme=Adwaita

[colors]
background=170d26f2
text=e8e0f5ff
prompt=c9b2f5ff
input=e8e0f5ff
match=c9b2f5ff
selection=3a1f5dff
selection-text=ffffffff
selection-match=e0d0ffff
border=c9b2f555

[border]
width=1
radius=20
